<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<link rel="icon" href="data:,"/>
<title>擎天柱能动演示版</title>

<style>
  :root{ --red:#E10600; --blue:#3B82F6; --panel:rgba(8,11,18,.8); --line:rgba(148,163,184,.22); --text:#F1F5F9; --muted:#9AA7B8; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070C;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
  #scene{position:fixed;inset:0}
  canvas{display:block}
  /* top bar */
  .top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;pointer-events:none;z-index:5}
  .title{border-left:3px solid var(--red);padding-left:10px}
  .title h1{margin:0;font-size:20px;letter-spacing:.14em;font-weight:800;line-height:1}
  .title h1 span{color:#CBD5E1;font-weight:600}
  .title p{margin:6px 0 0;color:var(--muted);font-size:11px;letter-spacing:.22em}
  .status{pointer-events:auto;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:6px;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:13px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 12px #22C55E}
  /* hint */
  .hint{position:fixed;top:78px;left:16px;z-index:4;background:rgba(5,8,14,.55);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;color:#CBD5E1;line-height:1.6;max-width:240px}
  .hint b{color:#fff}
  @media(max-width:640px){.hint{display:none}.title h1{font-size:17px}}
  /* bottom control deck */
  .deck{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top, rgba(2,4,8,.94) 55%, transparent);pointer-events:none}
  .deck-inner{max-width:980px;margin:0 auto;pointer-events:auto}
  .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .btn{min-height:46px;min-width:76px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;font-weight:700;letter-spacing:.14em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn:active{transform:scale(.97)}
  .btn.active{background:var(--red);border-color:#FF3B30;color:#fff;box-shadow:0 6px 24px rgba(225,6,0,.35)}
  .btn.blue.active{background:#1D4ED8;border-color:#3B82F6;box-shadow:0 6px 24px rgba(37,99,235,.35)}
  .btn.gold.active{background:#92400E;border-color:#F59E0B}
  .row2{margin-top:10px;display:flex;gap:10px;align-items:stretch;justify-content:space-between}
  /* D-pad */
  .pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:6px}
  .pad button{width:48px;height:48px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font-size:16px;cursor:pointer}
  .pad button:active,.pad button.on{background:var(--red)}
  .pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
  .side{display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:132px}
  .side button{min-height:44px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:#fff;font-weight:700;letter-spacing:.08em;cursor:pointer;padding:0 12px}
  .meter{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 6px;min-width:140px}
  .meter label{font-size:11px;color:var(--muted);letter-spacing:.12em;display:flex;justify-content:space-between}
  input[type=range]{width:100%;accent-color:var(--red);height:32px}
  @media(max-width:640px){ .row2{flex-wrap:wrap} .meter{order:3;flex-basis:100%} .side{flex-direction:row;flex:1} .side button{flex:1} }
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,0,.42) 100%),linear-gradient(to bottom,rgba(0,0,0,.22),transparent 18%,transparent 82%,rgba(0,0,0,.35))}
  #err{position:fixed;inset:auto 12px 110px 12px;z-index:99;display:none;background:#7F1D1D;color:#fff;padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.5;white-space:pre-wrap}
  .badge{font-size:11px;background:rgba(255,255,255,.12);padding:2px 6px;border-radius:4px;font-weight:600}
</style>
</head>
<body>
<div id="scene"></div>
<div id="vignette"></div>
<div id="err"></div>

<header class="top">
  <div class="title">
    <h1>擎天柱 <span>OPTIMUS PRIME</span></h1>
    <p>成型曲面装甲 · 梯形截面 / 英雄比例重排 · 万级实例化零件 · PBR 金属漆面</p>
  </div>
  <div class="status"><span class="dot"></span><span id="statusText">待机中 · Idle</span><span class="badge" id="detailBadge">高密细节层</span><span class="badge" id="modeBadge">机器人</span></div>
</header>

<div class="hint">
  <b>拖拽</b> 旋转视角 · <b>滚轮/双指</b> 缩放<br/>
  <b>W A S D</b> 移动转向 · <b>空格</b> 出拳<br/>
  点下方按钮切换动作，试试 <b>变形</b>
</div>

<div class="deck">
  <div class="deck-inner">
    <div class="actions" role="group" aria-label="动作">
      <button class="btn active" data-action="idle">待机</button>
      <button class="btn" data-action="walk">行走</button>
      <button class="btn" data-action="run">奔跑</button>
      <button class="btn blue" data-action="wave">挥手</button>
      <button class="btn blue" data-action="punch">出拳</button>
      <button class="btn gold" id="transformBtn">变形 · 卡车</button>
    </div>
    <div class="row2">
      <div class="pad" aria-label="移动">
        <button class="up" data-move="forward" aria-label="前进">▲</button>
        <button class="left" data-move="left" aria-label="左转">◀</button>
        <button class="down" data-move="back" aria-label="后退">▼</button>
        <button class="right" data-move="right" aria-label="右转">▶</button>
      </div>
      <div class="meter">
        <label><span>移动速度 SPEED</span><span id="speedVal">1.0×</span></label>
        <input id="speed" type="range" min="0.4" max="2.2" step="0.1" value="1"/>
        <label><span>提示：行走/奔跑时按住 ▲ 或 W 才会前进，松开原地踏步</span></label>
      </div>
      <div class="side">
        <button id="camBtn">重置视角</button>
        <button id="followBtn">跟随：开</button>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}
</script>
<script type="module">
import * as THREE_NS from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const THREE = Object.assign({}, THREE_NS, { OrbitControls, RoundedBoxGeometry });
window.THREE = THREE;
window.addEventListener('error',e=>{var d=document.getElementById('err');d.style.display='block';d.textContent='出错了：'+(e.message||e.error);});
window.addEventListener('unhandledrejection',e=>{var d=document.getElementById('err');d.style.display='block';d.textContent='出错了：'+(e.reason&&e.reason.message||e.reason);});
(function(){
"use strict";
// ---------- Audio (tiny synth, created on first tap) ----------
var AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function servo(dur){ var ac=audio(); if(!ac)return; var o=ac.createOscillator(),g=ac.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(180,ac.currentTime); o.frequency.exponentialRampToValueAtTime(520,ac.currentTime+dur); g.gain.setValueAtTime(0.06,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur); }
function clank(){ var ac=audio(); if(!ac)return; var o=ac.createOscillator(),g=ac.createGain(); o.type='square'; o.frequency.setValueAtTime(90,ac.currentTime); g.gain.setValueAtTime(0.12,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.18); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+0.2); }

// ---------- Renderer / Scene ----------
var container=document.getElementById('scene');
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.18;
renderer.outputColorSpace=THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070c);
scene.fog=new THREE.Fog(0x05070c, 16, 34);

var camera=new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 120);
camera.position.set(4.4,2.4,5.6);

// ---------- Procedural textures (paint wear / brushed metal / studio env) ----------
function canvasTex(w,h,draw,srgb){
  var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  draw(cv.getContext('2d'),w,h);
  var tx=new THREE.CanvasTexture(cv);
  tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  if(srgb) tx.colorSpace=THREE.SRGBColorSpace;
  tx.anisotropy=4;
  return tx;
}
// subtle scratches + scuffs used as roughness/bump variation on painted armor
var wearTex=canvasTex(1024,1024,function(g,w,h){
  g.fillStyle='#7a7a7a'; g.fillRect(0,0,w,h);
  for(var i=0;i<9000;i++){
    var v=80+Math.random()*110|0;
    g.fillStyle='rgb('+v+','+v+','+v+')';
    g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*3,1+Math.random()*2);
  }
  // fine scratches, bright exposed-metal hairlines + dark scores
  for(var j=0;j<340;j++){
    var bright=Math.random()<0.55;
    g.strokeStyle=bright?'rgba(215,215,215,.6)':'rgba(35,35,35,.5)';
    g.lineWidth=Math.random()<0.15?1.6:0.6;
    g.beginPath();
    var x=Math.random()*w,y=Math.random()*h,a=Math.random()*Math.PI,l=8+Math.random()*110;
    g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l*0.28); g.stroke();
  }
  // chipped-paint clusters: dark pit ringed by bright chip edge
  for(var c2=0;c2<130;c2++){
    var cx=Math.random()*w,cy=Math.random()*h,cr=1.5+Math.random()*5;
    g.fillStyle='rgba(230,230,230,.75)'; g.beginPath(); g.arc(cx,cy,cr,0,7); g.fill();
    g.fillStyle='rgba(30,30,30,.8)'; g.beginPath(); g.arc(cx,cy,cr*0.55,0,7); g.fill();
  }
  // panel-edge wear bands (catches light on armor edges via bump)
  g.strokeStyle='rgba(200,200,200,.35)'; g.lineWidth=2;
  for(var e2=0;e2<22;e2++){ var ey=Math.random()*h; g.beginPath(); g.moveTo(0,ey); g.lineTo(w,ey+(Math.random()-0.5)*30); g.stroke(); }
  for(var k=0;k<44;k++){ // darker grime patches
    var gx=Math.random()*w,gy=Math.random()*h,gr=20+Math.random()*80;
    var rad=g.createRadialGradient(gx,gy,0,gx,gy,gr);
    rad.addColorStop(0,'rgba(35,35,35,.4)'); rad.addColorStop(1,'rgba(35,35,35,0)');
    g.fillStyle=rad; g.fillRect(gx-gr,gy-gr,gr*2,gr*2);
  }
});
wearTex.repeat.set(3,3);
// brushed metal grain
var brushTex=canvasTex(512,512,function(g,w,h){
  g.fillStyle='#808080'; g.fillRect(0,0,w,h);
  for(var i=0;i<2400;i++){
    var v=95+Math.random()*70|0, y=Math.random()*h;
    g.strokeStyle='rgba('+v+','+v+','+v+',.55)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(0,y); g.lineTo(w,y+(Math.random()-0.5)*3); g.stroke();
  }
});
brushTex.repeat.set(1,3);
// studio softbox environment (equirect) → PMREM for true metal reflections.
// Deferred until after first paint: PMREM generation is heavy under software
// WebGL and must not block page load; materials pick the env up when it lands.
// Skipped entirely on software renderers (SwiftShader/llvmpipe), where PMREM
// can wedge the GPU process — lights alone carry those clients.
function isSoftwareGL(){
  try{
    var gl=renderer.getContext();
    var ext=gl.getExtension('WEBGL_debug_renderer_info');
    if(ext){ var r=String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||''); return /swiftshader|llvmpipe|softpipe|software/i.test(r); }
  }catch(e){}
  return false;
}
if(isSoftwareGL()){ renderer.setPixelRatio(1); renderer.shadowMap.enabled=false; } // software rasterizers: skip the extra shadow pass so frames stay fast
if(!isSoftwareGL()) setTimeout(function(){
try{
  var envTex=canvasTex(384,192,function(g,w,h){
    var grad=g.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#0a1224'); grad.addColorStop(0.42,'#26334d');
    grad.addColorStop(0.55,'#4a5a76'); grad.addColorStop(0.62,'#141a26'); grad.addColorStop(1,'#04060a');
    g.fillStyle=grad; g.fillRect(0,0,w,h);
    function softbox(x,y,bw,bh,color,alpha){
      var r=g.createRadialGradient(x,y,0,x,y,Math.max(bw,bh));
      r.addColorStop(0,color); r.addColorStop(1,'rgba(0,0,0,0)');
      g.globalAlpha=alpha; g.fillStyle=r; g.fillRect(x-bw*1.6,y-bh*1.6,bw*3.2,bh*3.2); g.globalAlpha=1;
      g.fillStyle='#ffffff'; g.fillRect(x-bw/2,y-bh/2,bw,bh);
    }
    softbox(300,120,300,44,'rgba(255,255,255,.95)',0.95);   // key softbox
    softbox(760,150,190,30,'rgba(160,195,255,.9)',0.8);     // cool strip
    softbox(90,210,26,120,'rgba(255,120,80,.85)',0.7);      // warm kicker
    softbox(950,230,20,100,'rgba(120,170,255,.8)',0.7);
    g.fillStyle='rgba(255,255,255,.9)'; g.fillRect(0,268,w,5); // horizon strip
  },true);
  envTex.mapping=THREE.EquirectangularReflectionMapping;
  var pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromEquirectangular(envTex).texture;
  pmrem.dispose();
}catch(e){ /* lights alone still carry the scene */ }
},2600);

// Orbit controls — use bundled addon when present, otherwise built-in fallback so page never crashes
function FallbackOrbit(cam, dom){
  this.target=new THREE.Vector3(0,1.35,0); this.enableDamping=true; this.dampingFactor=0.06;
  this.maxPolarAngle=Math.PI*0.52; this.minDistance=2.2; this.maxDistance=14;
  var sph=new THREE.Spherical(), tgt=new THREE.Spherical();
  var off=cam.position.clone().sub(this.target); sph.setFromVector3(off); tgt.copy(sph);
  var dragging=false,lx=0,ly=0,pinch=0;
  dom.style.touchAction='none';
  dom.addEventListener('pointerdown',function(e){dragging=true;lx=e.clientX;ly=e.clientY;dom.setPointerCapture(e.pointerId);});
  dom.addEventListener('pointermove',function(e){ if(!dragging)return; var dx=e.clientX-lx,dy=e.clientY-ly; lx=e.clientX;ly=e.clientY; tgt.theta-=dx*0.006; tgt.phi-=dy*0.005; tgt.phi=Math.max(0.15,Math.min(Math.PI*0.52,tgt.phi)); });
  dom.addEventListener('pointerup',function(){dragging=false;}); dom.addEventListener('pointercancel',function(){dragging=false;});
  dom.addEventListener('wheel',function(e){ e.preventDefault(); tgt.radius*= (e.deltaY>0?1.1:0.9); tgt.radius=Math.max(2.2,Math.min(14,tgt.radius)); },{passive:false});
  dom.addEventListener('touchmove',function(e){ if(e.touches.length===2){ var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); if(pinch) { tgt.radius*=pinch/d; tgt.radius=Math.max(2.2,Math.min(14,tgt.radius)); } pinch=d; } },{passive:true});
  dom.addEventListener('touchend',function(){pinch=0;});
  this.update=function(){ sph.theta+=(tgt.theta-sph.theta)*0.12; sph.phi+=(tgt.phi-sph.phi)*0.12; sph.radius+=(tgt.radius-sph.radius)*0.12; var v=new THREE.Vector3().setFromSpherical(sph); cam.position.copy(this.target).add(v); cam.lookAt(this.target); };
}
var controls=null;
try{ if(THREE.OrbitControls) controls=new THREE.OrbitControls(camera, renderer.domElement); }catch(e){ controls=null; }
if(!controls) controls=new FallbackOrbit(camera, renderer.domElement);
controls.target.set(0,1.35,0); if('enableDamping' in controls) controls.enableDamping=true; if('dampingFactor' in controls) controls.dampingFactor=0.06;
controls.maxPolarAngle=Math.PI*0.52; controls.minDistance=2.2; controls.maxDistance=14;

// ---------- Cinematic lighting ----------
scene.add(new THREE.HemisphereLight(0xbdd2f5,0x191009,0.62));
var key=new THREE.DirectionalLight(0xfff2e0,2.6); key.position.set(5,8.5,4); key.castShadow=true;
key.shadow.mapSize.set(1024,1024); key.shadow.camera.left=-6; key.shadow.camera.right=6; key.shadow.camera.top=7; key.shadow.camera.bottom=-4; key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; key.shadow.radius=4;
scene.add(key);
var rim=new THREE.DirectionalLight(0x5b9bff,2.0); rim.position.set(-6,4.5,-6); scene.add(rim);
var fill=new THREE.DirectionalLight(0x93a7c9,0.55); fill.position.set(-4,2.5,5); scene.add(fill);
var warm=new THREE.PointLight(0xff4a2e,14,11,1.6); warm.position.set(-3.2,0.9,3.2); scene.add(warm);
var spot=new THREE.SpotLight(0xf4f7ff,90,22,Math.PI/5.2,0.5,1.3); spot.position.set(0,7.5,0.6); spot.target.position.set(0,0,0); scene.add(spot); scene.add(spot.target);

// ---------- Showroom stage ----------
var backdrop=new THREE.Mesh(
  new THREE.CylinderGeometry(17,17,13,48,1,true),
  new THREE.MeshBasicMaterial({map:canvasTex(64,512,function(g,w,h){
    var gr=g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,'#02040a'); gr.addColorStop(0.45,'#0a1526'); gr.addColorStop(0.72,'#0d1626'); gr.addColorStop(1,'#05080f');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
  },true), side:THREE.BackSide, fog:false})
);
backdrop.position.y=4.5; scene.add(backdrop);
// polished dark floor — low roughness picks up the studio env like a showroom
var ground=new THREE.Mesh(new THREE.CircleGeometry(10,72), new THREE.MeshStandardMaterial({color:0x11161f,roughness:0.32,metalness:0.72,envMapIntensity:0.85}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
var stageDisc=new THREE.Mesh(new THREE.CircleGeometry(4.6,72), new THREE.MeshStandardMaterial({color:0x0c1220,roughness:0.16,metalness:0.85,envMapIntensity:1.1}));
stageDisc.rotation.x=-Math.PI/2; stageDisc.position.y=0.004; stageDisc.receiveShadow=true; scene.add(stageDisc);
var ringMat=new THREE.MeshBasicMaterial({color:0x3b82f6,transparent:true,opacity:0.5});
[2.2,3.4,4.55].forEach(function(r){ var ring=new THREE.Mesh(new THREE.RingGeometry(r,r+0.03,90),ringMat); ring.rotation.x=-Math.PI/2; ring.position.y=0.008; scene.add(ring); });
var grid=new THREE.PolarGridHelper(9.6,12,5,72,0x24466e,0x152540); grid.position.y=0.002; grid.material.transparent=true; grid.material.opacity=0.3; scene.add(grid);
// backdrop light towers
for(var i=0;i<10;i++){ var a=i/10*Math.PI*2+0.31;
  var tower=new THREE.Mesh(new THREE.BoxGeometry(0.22,4.4,0.22), new THREE.MeshStandardMaterial({color:0x131a26,roughness:0.45,metalness:0.75}));
  tower.position.set(Math.cos(a)*8.6,2.2,Math.sin(a)*8.6); scene.add(tower);
  var strip=new THREE.Mesh(new THREE.BoxGeometry(0.05,3.4,0.05), new THREE.MeshStandardMaterial({color:0x0b1e3a,emissive:0x2f6fd0,emissiveIntensity:1.5,roughness:0.4,metalness:0.2}));
  strip.position.set(Math.cos(a)*8.42,2.2,Math.sin(a)*8.42); scene.add(strip);
}
// drifting dust motes for depth
var dustGeo=new THREE.BufferGeometry(); var dustPos=new Float32Array(240*3);
for(var di=0;di<240;di++){ dustPos[di*3]=(Math.random()-0.5)*15; dustPos[di*3+1]=Math.random()*5.5+0.2; dustPos[di*3+2]=(Math.random()-0.5)*15; }
dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
var dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0x9db8dd,size:0.035,transparent:true,opacity:0.5,depthWrite:false}));
scene.add(dust);

// ---------- PBR materials (car-paint clearcoat + real metals + wear maps) ----------
function paint(c,extra){
  var o={color:c,roughness:0.27,metalness:0.32,clearcoat:1.0,clearcoatRoughness:0.14,roughnessMap:wearTex,bumpMap:wearTex,bumpScale:0.9,envMapIntensity:1.3};
  if(extra)for(var k in extra)o[k]=extra[k];
  return new THREE.MeshPhysicalMaterial(o);
}
function metal(c,r,extra){

function dMesh(geo,mat,x,y,z,parent,rx,ry,rz){
  var m=new THREE.Mesh(geo,mat); m.position.set(x,y,z);
  if(rx)m.rotation.x=rx; if(ry)m.rotation.y=ry; if(rz)m.rotation.z=rz;
  m.receiveShadow=true; if(parent)parent.add(m); detailCount++; return m;
}
function bolt(parent,x,y,z,rx,ry,rz,small){ return dMesh(small?boltGeoS:boltGeo,MAT.chrome,x,y,z,parent,rx||0,ry||0,rz||0); }
function rivet(parent,x,y,z){ return dMesh(rivetGeo,MAT.steelDark,x,y,z,parent); }
// rectangle of 8 front-facing bolts (corners + edge midpoints) on a +Z face
function boltRectZ(parent,cx,cy,z,hw,hh,small){
  var pts=[[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh],[0,-hh],[0,hh],[-hw,0],[hw,0]];
  for(var i=0;i<8;i++) bolt(parent,cx+pts[i][0],cy+pts[i][1],z,Math.PI/2,0,0,small);
}
function boltRowZ(parent,x0,x1,y,z,n,small){ for(var i=0;i<n;i++) bolt(parent,x0+(x1-x0)*(n===1?0:i/(n-1)),y,z,Math.PI/2,0,0,small); }
function boltRowY(parent,x0,x1,z,y,n,small){ for(var i=0;i<n;i++) bolt(parent,x0+(x1-x0)*(n===1?0:i/(n-1)),y,z,0,0,0,small); }
// ring of bolts on an X-facing disc (elbow / knee / wheel hub)
function boltRingX(parent,cx,cy,cz,r,n,small){
  for(var i=0;i<n;i++){ var a=i/n*Math.PI*2; bolt(parent,cx,cy+Math.cos(a)*r,cz+Math.sin(a)*r,0,0,Math.PI/2,small); }
}
function seamZ(parent,cx,cy,z,w,h){ plate(w,h,0.012,MAT.seam,cx,cy,z,parent); detailCount++; }
function hose(parent,pts,r,mat){
  var v=pts.map(function(p){ return new THREE.Vector3(p[0],p[1],p[2]); });
  var geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(v),14,r,7,false);
  var m=new THREE.Mesh(geo,mat||cableMat); m.castShadow=true; m.receiveShadow=true; parent.add(m); detailCount++; return m;
}
var greebleMats=[MAT.dark,MAT.steelDark,MAT.joint,MAT.copper,MAT.brushed];
function greeble(parent,cx,cy,cz,n,sx,sy,sz,thinAxis){
  for(var i=0;i<n;i++){
    var w2=0.02+rnd()*0.05,h2=0.015+rnd()*0.045,d2=0.02+rnd()*0.05;
    if(thinAxis==='x') w2=0.022; if(thinAxis==='z') d2=0.022;
    var m=box(w2,h2,d2,greebleMats[(rnd()*greebleMats.length)|0],
      cx+(rnd()-0.5)*sx, cy+(rnd()-0.5)*sy, cz+(rnd()-0.5)*sz, parent);
    if(rnd()<0.3) m.rotation.y=(rnd()-0.5)*0.4;
    detailCount++;
  }
}

// ============================================================
// SCULPT PASS 2 — silhouette + instanced micro-detail architecture.
// Curved / tapered armor overlays fix the blocky read (domed
// pauldrons, chest taper wedges, boot flares, sculpted face),
// while InstancedMesh systems — perforation fields, rivet lines,
// cooling fins, stage plating — push the true rendered part
// count past ten thousand at ~15 extra draw calls.
// ============================================================
var instancedParts=0;
var _im4=new THREE.Matrix4(),_iq=new THREE.Quaternion(),_ie=new THREE.Euler(),_iv=new THREE.Vector3(),_isv=new THREE.Vector3();
function instanced(geo,mat,list,parent){
  var im=new THREE.InstancedMesh(geo,mat,list.length);
  for(var ii=0;ii<list.length;ii++){ var it=list[ii];
    _ie.set(it.r?it.r[0]:0,it.r?it.r[1]:0,it.r?it.r[2]:0); _iq.setFromEuler(_ie);
    _iv.set(it.p[0],it.p[1],it.p[2]); var sc=it.s||1; _isv.set(sc,sc,sc);
    _im4.compose(_iv,_iq,_isv); im.setMatrixAt(ii,_im4);
  }
  im.instanceMatrix.needsUpdate=true; im.receiveShadow=true;
  if(parent)parent.add(im); instancedParts+=list.length; return im;
}
var holeGeo=new THREE.CylinderGeometry(0.0062,0.0062,0.01,8);
function perfZ(parent,cx,cy,z,nx,ny,dx,dy){ // perforation field on a Z-facing panel
  var list=[];
  for(var i=0;i<nx;i++)for(var j=0;j<ny;j++) list.push({p:[cx+(i-(nx-1)/2)*dx, cy+(j-(ny-1)/2)*dy, z], r:[Math.PI/2,0,0]});
  return instanced(holeGeo,MAT.seam,list,parent);
}
function perfX(parent,x,cy,cz,ny,nz,dy,dz){ // perforation field on an X-facing panel
  var list=[];
  for(var j=0;j<ny;j++)for(var k=0;k<nz;k++) list.push({p:[x, cy+(j-(ny-1)/2)*dy, cz+(k-(nz-1)/2)*dz], r:[0,0,Math.PI/2]});
  return instanced(holeGeo,MAT.seam,list,parent);
}
var rivetGeoI=new THREE.SphereGeometry(0.0078,6,5);
function rivetRectZ(parent,cx,cy,z,hw,hh,step){ // rivet line around a Z-facing panel edge
  var list=[],x,y;
  for(x=-hw;x<=hw+0.001;x+=step){ list.push({p:[cx+x,cy-hh,z]}); list.push({p:[cx+x,cy+hh,z]}); }
  for(y=-hh+step;y<=hh-step+0.001;y+=step){ list.push({p:[cx-hw,cy+y,z]}); list.push({p:[cx+hw,cy+y,z]}); }
  return instanced(rivetGeoI,MAT.steelDark,list,parent);
}
var finGeo=new THREE.BoxGeometry(0.15,0.007,0.055);
function finStackY(parent,cx,cy,cz,n,dy,w){ // vertical stack of horizontal cooling fins
  var list=[];
  for(var i=0;i<n;i++) list.push({p:[cx,cy+(i-(n-1)/2)*dy,cz]});
  var im=instanced(finGeo,MAT.dark,list,parent); if(w) im.scale.x=w/0.15; return im;
}

// ============================================================
// SCULPT PASS 3 — FORM, not surface. Trapezoidal-section formed
// armor replaces the box read: chest sides slope into a narrow
// waist, thighs taper down, shins flare into boots, forearms
// widen to the wrist, and an enlarged helmet shell (dome + side
// guards + tall crest) fixes the pin-head proportion. Legs are
// lengthened (hip groups scaled, hip height raised in the rig)
// for a heroic long-leg / wide-shoulder silhouette.
// ============================================================
function trapGeo(wt,wb,h,dt,db){
  var hwT=wt/2,hwB=wb/2,hdT=dt/2,hdB=db/2,hh=h/2;
  var v=[-hwT,hh,-hdT, hwT,hh,-hdT, hwT,hh,hdT, -hwT,hh,hdT,
         -hwB,-hh,-hdB, hwB,-hh,-hdB, hwB,-hh,hdB, -hwB,-hh,hdB];
  var idx=[0,1,2,0,2,3, 4,6,5,4,7,6, 0,4,5,0,5,1, 1,5,6,1,6,2, 2,6,7,2,7,3, 3,7,4,3,4,0];
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
  g.setIndex(idx); g=g.toNonIndexed(); g.computeVertexNormals(); return g;
}
function trap(wt,wb,h,dt,db,mat,x,y,z,parent,ry){
  var m=new THREE.Mesh(trapGeo(wt,wb,h,dt,db),mat);
  m.position.set(x,y,z); if(ry)m.rotation.y=ry;
  m.castShadow=true; m.receiveShadow=true; if(parent)parent.add(m); detailCount++; return m;
}
function dome(parent,r,sx,sy,sz,mat,x,y,z){
  var m=new THREE.Mesh(new THREE.SphereGeometry(r,26,16,0,Math.PI*2,0,Math.PI/2),mat);
  m.scale.set(sx,sy,sz); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); detailCount++; return m;
}

[-1,1].forEach(function(s){

});

});
[{a:armL,s:-1},{a:armR,s:1}].forEach(function(o){

  rivetRectZ(o.a.sh,0,-0.26,0.145,0.115,0.20,0.04);                              // upper-arm rivet frame
});
perfZ(torso,0,0.56,-0.445,34,22,0.02,0.022);                                     // backpack shell field
rivetRectZ(head,0,0.115,0.20,0.11,0.09,0.028);                                   // tapered-face rivet line
// --- de-clutter: remove the dotted floor perforation carpet (kept the

// ----- Truck-only parts: ribbed trailer, tanks, mudflaps, light bar -----

// ---------- Animation state ----------
var action='idle', prevAction='idle';
var speedMul=1, follow=true;
var keys={}, pad={};
var heading=0, pos=new THREE.Vector3(0,0,0);
var transformT=0, transformTarget=0, isTruck=false;
var punchClock=-1, waveClock=0;
var statusEl=document.getElementById('statusText'), badgeEl=document.getElementById('modeBadge');
var names={idle:'待机中 · Idle',walk:'行走中 · Walk',run:'奔跑中 · Run',wave:'挥手 · Wave',punch:'出拳 · Punch'};

function setAction(a){
  prevAction=action; action=a;
  document.querySelectorAll('[data-action]').forEach(function(b){ b.classList.toggle('active', b.dataset.action===a); });
  statusEl.textContent=(isTruck?'卡车形态 · Truck':names[a]||a);
  if(a==='punch'){ punchClock=0; clank(); }
  if(a==='wave'){ servo(0.35); }
}
document.querySelectorAll('[data-action]').forEach(function(b){
  b.addEventListener('click',function(){ audio(); if(isTruck) toggleTransform(); setAction(b.dataset.action); });
});
function toggleTransform(){
  isTruck=!isTruck; transformTarget=isTruck?1:0; servo(0.9);
  document.getElementById('transformBtn').classList.toggle('active',isTruck);
  document.getElementById('transformBtn').textContent=isTruck?'变回机器人':'变形 · 卡车';
  badgeEl.textContent=isTruck?'卡车':'机器人';
  statusEl.textContent=isTruck?'变形中… → 卡车形态':'变形中… → 机器人形态';
  setTimeout(function(){ statusEl.textContent=isTruck?'卡车形态 · Truck（按 ▲ 前进）':names[action]; },1000);
}
document.getElementById('transformBtn').addEventListener('click',function(){ audio(); toggleTransform(); });
document.getElementById('camBtn').addEventListener('click',function(){ camera.position.set(4.4,2.4,5.6); controls.target.set(pos.x,1.35,pos.z); });
var followBtn=document.getElementById('followBtn');
followBtn.addEventListener('click',function(){ follow=!follow; followBtn.textContent=follow?'跟随：开':'跟随：关'; });
var speedInput=document.getElementById('speed');
speedInput.addEventListener('input',function(){ speedMul=parseFloat(speedInput.value); document.getElementById('speedVal').textContent=speedMul.toFixed(1)+'×'; });

// Keyboard
addEventListener('keydown',function(e){
  if(e.code==='Space'){ e.preventDefault(); if(!isTruck) setAction('punch'); return; }
  keys[e.code]=true;
});
addEventListener('keyup',function(e){ keys[e.code]=false; });
// Touch pad
document.querySelectorAll('[data-move]').forEach(function(b){
  var k=b.dataset.move;
  function on(e){ e.preventDefault(); audio(); pad[k]=true; b.classList.add('on'); }
  function off(e){ if(e) e.preventDefault(); pad[k]=false; b.classList.remove('on'); }
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off);
});

// Pose helpers — damped joints
function damp(cur,target,lambda,dt){ return THREE.MathUtils.damp(cur,target,lambda,dt); }
function setJoint(g,tx,ty,tz,dt){
  var L=14;
  g.rotation.x=damp(g.rotation.x,tx,L,dt);
  g.rotation.y=damp(g.rotation.y,ty,L,dt);
  g.rotation.z=damp(g.rotation.z,tz,L,dt);
}

var _last=performance.now(), _elapsed=0;
var phase=0;
function animate(){
  requestAnimationFrame(animate);
  var _now=performance.now(); var dt=Math.min((_now-_last)/1000,0.05); _last=_now; _elapsed+=dt;
  var t=_elapsed;

  dust.rotation.y=t*0.008;

  // transform interpolation
  transformT=damp(transformT,transformTarget,3.2,dt);
  if(Math.abs(transformT-transformTarget)<0.002) transformT=transformTarget;
  truckParts.visible=transformT>0.03;
  var tp=transformT;
  truckParts.scale.setScalar(Math.max(0.001,tp));
  truckParts.position.y=(1-tp)*0.2;

  // input → movement
  var fwd=(keys.KeyW||pad.forward)?1:((keys.KeyS||pad.back)?-1:0);
  var turn=(keys.KeyA||pad.left)?1:((keys.KeyD||pad.right)?-1:0);
  var moving=false, moveSpeed=0;
  if(tp<0.5){
    heading+=turn*1.9*dt*(fwd<0?-1:1);
    if(fwd!==0 && (action==='walk'||action==='run'||action==='idle')){
      if(action==='idle') setAction('walk');
      moveSpeed=(action==='run'?2.6:1.35)*speedMul*fwd;
      moving=true;
    }
  }else{
    heading+=turn*1.4*dt*(fwd<0?-1:1);
    if(fwd!==0){ moveSpeed=2.8*speedMul*fwd; moving=true; }
  }
  pos.x+=Math.sin(heading)*moveSpeed*dt;
  pos.z+=Math.cos(heading)*moveSpeed*dt;
  var rr=Math.hypot(pos.x,pos.z); if(rr>7.2){ pos.x*=7.2/rr; pos.z*=7.2/rr; }
  root.position.set(pos.x,0,pos.z);
  root.rotation.y=heading;

  // gait phase
  var freq=(action==='run'?10.5:6.2)*speedMul;
  if(action==='walk'||action==='run'||moving) phase+=dt*freq;
  else phase+=dt*1.2;

  var s=Math.sin(phase), c=Math.cos(phase);
  var P={
    hipL:[0,0,0],kneeL:[0,0,0],hipR:[0,0,0],kneeR:[0,0,0],
    shL:[0,0,0.07],elL:[-0.12,0,0],shR:[0,0,-0.07],elR:[-0.12,0,0],
    torso:[0,0,0],head:[0,Math.sin(t*0.4)*0.14,0],hipsY:1.48+Math.sin(t*1.6)*0.015,hipsR:[0,0,0]
  };
  if(action==='idle'){
    P.shL[0]=Math.sin(t*1.6)*0.05; P.shR[0]=-Math.sin(t*1.6)*0.05;
    P.torso[0]=Math.sin(t*1.6)*0.015;
  }
  if(action==='walk'||action==='run'){
    var amp=action==='run'?0.85:0.55, kamp=action==='run'?1.05:0.7;
    P.hipL[0]=s*amp; P.hipR[0]=-s*amp;
    P.kneeL[0]=Math.max(0,-s)*kamp+0.08; P.kneeR[0]=Math.max(0,s)*kamp+0.08;
    P.shL[0]=-s*amp*0.75; P.shR[0]=s*amp*0.75;
    P.elL[0]=action==='run'?-0.9-Math.max(0,-s)*0.3:-0.25;
    P.elR[0]=action==='run'?-0.9-Math.max(0,s)*0.3:-0.25;
    P.torso[0]=action==='run'?0.20:0.07; P.torso[1]=s*0.06;
    P.hipsY=1.48+Math.abs(c)*(action==='run'?0.07:0.04)-(action==='run'?0.05:0);
    P.head[0]=action==='run'?0.12:0.02;
  }
  if(action==='wave'){
    P.shR=[-2.25,0,-0.35]; P.elR=[-0.25,0,Math.sin(t*7)*0.55];
    P.shL[0]=Math.sin(t*1.6)*0.05;
    P.head[2]=Math.sin(t*7)*0.04; P.head[1]=-0.15;
    P.torso[1]=-0.12;
  }
  if(action==='punch'){
    if(punchClock>=0) punchClock+=dt;
    var pc=punchClock%1.15, wind=0, thrust=0;
    if(pc<0.35){ wind=pc/0.35; } else if(pc<0.5){ thrust=1; wind=1-(pc-0.35)/0.15; } else { thrust=Math.max(0,1-(pc-0.5)/0.4); }
    P.shR[0]= -wind*0.5 - thrust*1.55;
    P.elR[0]= -0.9*(wind) -0.08*thrust + -0.15*(1-wind-thrust>0?1:0);
    if(thrust<0.2 && wind<0.2) P.elR[0]=-0.15;
    P.shR[2]=-0.07-thrust*0.1;
    P.torso[1]= wind*0.25 - thrust*0.45;
    P.torso[0]= thrust*0.10;
    P.shL[0]= thrust*0.4; P.elL[0]=-0.7;
    P.head[1]=-thrust*0.3;
    if(pc>0.35&&pc<0.42&&!animate._clanked){ animate._clanked=true; clank(); }
    if(pc>1.0) animate._clanked=false;
  }

  // Truck pose override (lerp by tp)
  if(tp>0.001){
    function mix(a,b){ return a+(b-a)*tp; }
    P.hipL[0]=mix(P.hipL[0],-1.45); P.hipR[0]=mix(P.hipR[0],-1.45);
    P.kneeL[0]=mix(P.kneeL[0],0.12); P.kneeR[0]=mix(P.kneeR[0],0.12);
    P.shL=[mix(P.shL[0],0.15),0,mix(P.shL[2],0.55)];
    P.shR=[mix(P.shR[0],0.15),0,mix(P.shR[2],-0.55)];
    P.elL[0]=mix(P.elL[0],-0.15); P.elR[0]=mix(P.elR[0],-0.15);
    P.torso[0]=mix(P.torso[0],-0.18);
    P.hipsY=mix(P.hipsY,0.62);
    head.scale.setScalar(1.30*Math.max(0.05,1-tp*1.05));
    var spin=moving?moveSpeed*dt*3.2:0;
    [tw1,tw2,tw3,tw4,fw1,fw2].forEach(function(w){ if(w) w.rotation.x+=spin; });
    legL.wheel.rotation.x+=spin; legR.wheel.rotation.x+=spin;
  } else {
    head.scale.setScalar(1.30);
    if(moving){ legL.wheel.rotation.x+=moveSpeed*dt*2.4; legR.wheel.rotation.x+=moveSpeed*dt*2.4; }
  }

  // apply
  setJoint(legL.hip,P.hipL[0],P.hipL[1],P.hipL[2],dt);
  setJoint(legL.knee,P.kneeL[0],0,0,dt);
  setJoint(legR.hip,P.hipR[0],P.hipR[1],P.hipR[2],dt);
  setJoint(legR.knee,P.kneeR[0],0,0,dt);
  setJoint(armL.sh,P.shL[0],P.shL[1],P.shL[2],dt);
  setJoint(armL.el,P.elL[0],P.elL[1],P.elL[2],dt);
  setJoint(armR.sh,P.shR[0],P.shR[1],P.shR[2],dt);
  setJoint(armR.el,P.elR[0],P.elR[1],P.elR[2],dt);
  setJoint(torso,P.torso[0],P.torso[1],P.torso[2],dt);
  setJoint(head,P.head[0],P.head[1],P.head[2],dt);
  hips.position.y=damp(hips.position.y,P.hipsY,12,dt);

  if(follow){
    var dx=pos.x-controls.target.x, dz=pos.z-controls.target.z;
    controls.target.x+=dx*0.06; controls.target.z+=dz*0.06; controls.target.y=damp(controls.target.y, tp>0.5?0.6:1.35, 6, dt);
    camera.position.x+=dx*0.06; camera.position.z+=dz*0.06;
  }
  controls.update();
  renderer.render(scene,camera);
}
// Start after window load: the first frame compiles heavy PBR shaders, and
// running it synchronously would block DOMContentLoaded on slow renderers.
var _started=false;
function _start(){ if(_started) return; _started=true; _last=performance.now(); requestAnimationFrame(animate); }
if(document.readyState==='complete') _start();
else addEventListener('load',_start);
setTimeout(_start,1200); // fallback if load is delayed by a stalled resource

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
